services:
  glpi:
    image: ${GLPI_IMAGE:-glpi/glpi:10.0.26}
    container_name: glpi-docker
    restart: unless-stopped
    env_file:
      - .env.glpi
    ports:
      - "${GLPI_PORT:-8095}:80"
    volumes:
      - glpi_data:/var/glpi
      - /var/run/mysqld/mysqld.sock:/var/run/mysqld/mysqld.sock
      - ./glpi-docker/php-socket.ini:/usr/local/etc/php/conf.d/zz-socket.ini:ro
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$body=@file_get_contents(\"http://127.0.0.1/\"); exit($$body===false ? 1 : 0);'"]
      interval: 20s
      timeout: 8s
      retries: 6
      start_period: 45s
    networks:
      - glpi-network
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: "2G"
        reservations:
          cpus: "1"
          memory: "512M"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./glpi-frontend
    env_file:
      - .env.settings
    image: ${FRONTEND_IMAGE:-glpi-frontend-local:1.1}
    container_name: glpi-frontend
    restart: unless-stopped
    working_dir: /app
    environment:
      GLPI_BACKEND_URL: ${GLPI_BACKEND_URL:-http://glpi}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost:8091,http://127.0.0.1:8091}
      GLPI_SSL_VERIFYPEER: ${GLPI_SSL_VERIFYPEER:-1}
      GLPI_SSL_VERIFYHOST: ${GLPI_SSL_VERIFYHOST:-1}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-1000}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-60}
    ports:
      - "${FRONTEND_PORT:-8091}:80"
    volumes:
      - ./glpi-frontend:/app
    depends_on:
      glpi:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$data=@file_get_contents(\"http://127.0.0.1/backend/health\"); exit($$data===false ? 1 : 0);'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - glpi-network
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "512M"
        reservations:
          cpus: "0.25"
          memory: "128M"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    container_name: glpi-caddy
    restart: unless-stopped
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    networks:
      - glpi-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"
        reservations:
          cpus: "0.1"
          memory: "64M"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  glpi-cron:
    image: ${GLPI_IMAGE:-glpi/glpi:10.0.26}
    container_name: glpi-cron
    env_file:
      - .env.glpi
    working_dir: /var/www/html
    volumes:
      - glpi_data:/var/glpi
    entrypoint: "/bin/sh"
    command: -c "while true; do php -r '$$body=@file_get_contents(\"http://127.0.0.1/apirest.php/0/User/0\");'"; sleep 60; done"
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$body=@file_get_contents(\"http://127.0.0.1/apirest.php/0/User/0\"); exit($$body===false ? 1 : 0);'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - glpi-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "128M"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: glpi-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
      - '--storage.tsdb.retention.size=500MB'
      - '--web.enable-lifecycle'
    networks:
      - glpi-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: glpi-cadvisor
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - glpi-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  glpi_data:
    external: true
    name: ${GLPI_DATA_VOLUME:-5460f57d138e1c1d896b6ac3003fb99c9ccf0c85e60efdbe593d3d02bf736cf4}
  caddy_data:
  caddy_config:
  prometheus_data:

networks:
  glpi-network:
    external: true
    name: ${GLPI_NETWORK:-glpi-network}
