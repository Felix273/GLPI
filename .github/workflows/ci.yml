name: GLPI CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  validate:
    name: Validate Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Display PHP Version
        run: php -v

      - name: Check PHP Syntax
        run: |
          find . -type f -name "*.php" -not -path "./vendor/*" -not -path "./glpi/vendor/*" -print0 | xargs -0 -n1 php -l

      - name: Check JS Syntax
        run: |
          find glpi-frontend -name "*.js" -not -path "*/node_modules/*" -print0 | xargs -0 -n1 node --check

      - name: Validate Docker Compose
        run: |
          if [ -f compose.yml ] || [ -f docker-compose.yml ]; then
            docker compose config
          else
            echo "No compose file found. Skipping."
          fi

      - name: Verify README Exists
        run: test -f README.md

      - name: Verify .gitignore Exists
        run: test -f .gitignore

      - name: Repository Validation Complete
        run: echo "Repository validation completed successfully."

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2

      - name: Install backend dependencies
        run: |
          cd glpi-frontend
          composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPUnit tests
        run: |
          cd glpi-frontend
          php vendor/bin/phpunit --no-coverage

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: |
          cd glpi-frontend
          npm ci

      - name: Run Vitest tests
        run: |
          cd glpi-frontend
          npm test

      - name: Build frontend
        run: |
          cd glpi-frontend
          npm run build

      - name: Run authenticated browser E2E when credentials are available
        if: ${{ secrets.E2E_GLPI_USER_TOKEN != '' }}
        env:
          E2E_BASE_URL: http://127.0.0.1:8091
          E2E_GLPI_URL: http://127.0.0.1:8095
          E2E_GLPI_USER_TOKEN: ${{ secrets.E2E_GLPI_USER_TOKEN }}
          E2E_GLPI_APP_TOKEN: ${{ secrets.E2E_GLPI_APP_TOKEN }}
        run: |
          cd glpi-frontend
          npm run test:e2e

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Run Trivy vulnerability scanner (container)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: 'glpi/glpi:10.0.26'
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          upload-sarif: 'trivy-results.sarif'
          checkout-path: ''
