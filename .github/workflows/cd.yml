name: GLPI CD

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment target'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'production' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Build and push frontend image
        run: |
          IMAGE_TAG="${GITHUB_SHA::8}"
          docker build -t "${{ secrets.DOCKERHUB_USERNAME }}/glpi-frontend:${IMAGE_TAG}" -t "${{ secrets.DOCKERHUB_USERNAME }}/glpi-frontend:latest" glpi-frontend/
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/glpi-frontend:${IMAGE_TAG}"
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/glpi-frontend:latest"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: SSH Deploy
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            cd '${{ secrets.DEPLOY_PATH }}' &&
            docker compose pull &&
            docker compose up -d --build &&
            echo 'Deployment complete'
          "
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}

      - name: Smoke Test
        run: |
          sleep 15
          curl -f -s "https://${{ secrets.DOMAIN }}/backend/health" || exit 1
          curl -f -s "https://${{ secrets.DOMAIN }}/" || exit 1
          echo "Smoke test passed"
